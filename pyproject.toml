[project]
name = "template"
version = "0.1.0"
description = "A general purpose machine learning project template."
readme = "README.md"
authors = [{ name = "Will Rice", email = "wrice20@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "git-python>=1.0.3",
  "lightning>=2.6.6",
  "pre-commit>=4.6.2",
  "pydantic>=2.13.5",
  "pydocstyle>=6.3.0",
  "pytest>=9.1.1",
  "python-dotenv>=1.2.3",
  "ruff>=0.16.8",
  "torch>=2.14.0",
  "torchaudio>=2.11.0",
  "torchcodec>=0.16.0",
  "torchvision>=0.29.0",
  "ty>=0.0.83",
  "wandb>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.12.18"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["template"]

[tool.ruff.lint.isort]
known-first-party = ["template"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "D", "N", "B", "PTH", "ANN"]
ignore = ["D107"]
exclude = [".venv"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[project.scripts]
train = "template.scripts.train:main"
